# Surge 配置示例 - 爱回收 iPhone 筛选

[script]
# 爱回收 iPhone 筛选脚本
http-request ^https?://www\.iaihuishou\.com/api/search/iphone script-path=https://raw.githubusercontent.com/liangpengfeng/aihuishou-filter/main/aihuishou_filter.js, requires-body=true, timeout=30

# 或者使用本地脚本
# http-request ^https?://www\.iaihuishou\.com/script.js$ script-path=file:///var/mobile/Library/MobileSubstrate/DynamicLibraries/filter.js

[rewrite]
# 如果需要重写

[mitm]
hostname = www.iaihuishou.com
